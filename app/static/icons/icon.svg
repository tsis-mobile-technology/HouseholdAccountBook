<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E6CF" />
      <stop offset="50%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#DED2F9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#pastelGrad)" />
  <!-- Glass Wallet Inner -->
  <g filter="url(#softGlow)">
    <rect x="96" y="140" width="320" height="232" rx="36" fill="#FFFFFF" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="4" />
    <path d="M96 210 Q 256 180 416 210" stroke="#E2E8F0" stroke-width="3" fill="none" />
    <!-- Wallet Flap -->
    <rect x="270" y="220" width="146" height="72" rx="20" fill="#DED2F9" stroke="#FFFFFF" stroke-width="3" />
    <!-- Gold Coin Button -->
    <circle cx="370" cy="256" r="14" fill="#FFD3B6" stroke="#FFFFFF" stroke-width="3" />
    <!-- Sparkles -->
    <circle cx="150" cy="180" r="8" fill="#A8E6CF" />
    <circle cx="180" cy="190" r="5" fill="#FFB7B2" />
  </g>
</svg>
